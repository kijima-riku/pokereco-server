version: "3.8"

services:
  service_postgres:
    image: postgres:15.6
    container_name: pokereco-db
    platform: linux/x86_64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: pokereco-pass
      POSTGRES_USER: pokereco-user
      POSTGRES_DB: pokereco-db
    volumes:
      - pokereco-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokereco-user -d pokereco-db"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pokereco-network

  service_pdadmin4:
    image: dpage/pgadmin4:8.5
    container_name: pokereco-pdadmin
    platform: linux/x86_64
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pokereco.com
      PGADMIN_DEFAULT_PASSWORD: pokereco-pass
    volumes:
      - pokereco-pdadmin4-data:/var/lib/pgadmin
    ports:
      - "8081:80"
    depends_on:
      service_postgres:
        condition: service_healthy
    networks:
      - pokereco-network

  nginx:
    image: nginx:latest
    container_name: pokereco-nginx
    ports:
      - "3000:3000"  # ブラウザからは https://localhost:3000 でアクセス
    volumes:
      # プロジェクトルートの nginx.conf をコンテナ内の設定ファイルにマウント
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # mkcert などで生成した証明書を格納するディレクトリ（例：certs/）をマウント
      - ./certs:/etc/nginx/certs:ro
    # ホスト側の API サーバーへアクセスするため、ネットワークはデフォルトで OK （host.docker.internal を利用）
    networks:
      - pokereco-network

volumes:
  pokereco-postgres-data:
  pokereco-pdadmin4-data:

networks:
  pokereco-network:
    driver: bridge
